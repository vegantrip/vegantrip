<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>world clock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@1&display=swap" rel="stylesheet">
<style>
  :root {
    --time-size: 48px;
    --time-stroke: 0.6px;
    --time-skew: -6deg;
    --city-size: 13px;
    --date-size: 12px;
    --gap: 56px;

    --sub-time-size: 24px;
    --sub-time-stroke: 0.35px;
    --sub-city-size: 11px;
    --sub-date-size: 11px;
    --sub-gap: 20px;

    --text-color: #37352f;
    --sub-color: #9b9a97;
    --accent: #e8788a;
    --font: "Georgia", "Times New Roman", serif;
    --font-time: "DM Serif Display", "Times New Roman", serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --text-color: #ffffffcc; --sub-color: #ffffff80; }
  }

  html, body { margin: 0; background: transparent; }
  body {
    font-family: var(--font);
    color: var(--text-color);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 40px;
    min-height: 100vh;
    padding: 16px;
    box-sizing: border-box;
    text-align: center;
  }
  .row { display: flex; justify-content: center; align-items: flex-start; }
  #main { gap: var(--gap); flex-wrap: wrap; }
  #sub  { gap: var(--sub-gap); flex-wrap: nowrap; }

  .city { font-size: var(--city-size); color: var(--sub-color); letter-spacing: 0.04em; }
  .flag { margin-right: 3px; vertical-align: -1px; opacity: 0.9; letter-spacing: 0; }
  .time {
    font-family: var(--font-time);
    font-style: italic;
    font-weight: 400;
    color: var(--accent);
    line-height: 1.1;
    margin: 6px 0;
    letter-spacing: 0.02em;
    white-space: nowrap;
    font-variant-numeric: lining-nums tabular-nums;
    font-feature-settings: "lnum" 1, "tnum" 1;
  }
  .time span { display: inline-block; transform: skewX(var(--time-skew)); }
  .date { font-size: var(--date-size); color: var(--sub-color); letter-spacing: 0.05em; }
