<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>world clock</title>
<style>
  :root {
    --time-size: 44px;
    --city-size: 13px;
    --date-size: 12px;
    --text-color: #37352f;
    --sub-color: #9b9a97;
    --accent: #e8788a;
    --gap: 40px;
    --font: "Georgia", "Times New Roman", serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --text-color: #ffffffcc; --sub-color: #ffffff80; }
  }

  html, body { margin: 0; background: transparent; }
  body {
    font-family: var(--font);
    color: var(--text-color);
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: var(--gap);
    min-height: 100vh;
    padding: 16px;
    box-sizing: border-box;
    text-align: center;
  }
  .city { font-size: var(--city-size); color: var(--sub-color); letter-spacing: 0.1em; text-transform: uppercase; }
  .time { font-size: var(--time-size); color: var(--accent); line-height: 1.1; margin: 6px 0; font-weight: 600; font-variant-numeric: tabular-nums; }
  .date { font-size: var(--date-size); color: var(--sub-color); letter-spacing: 0.05em; }
</style>
</head>
<body>

<div id="clocks" style="display:contents"></div>

<script>
  const USE_24H = true;

  const CITIES = [
    { name: "Seoul",     tz: "Asia/Seoul" },
    { name: "Hong Kong", tz: "Asia/Hong_Kong" }
    // { name: "Dresden",   tz: "Europe/Berlin" },
    // { name: "Tokyo",     tz: "Asia/Tokyo" },
    // { name: "New York",  tz: "America/New_York" },
    // { name: "London",    tz: "Europe/London" },
  ];

  const root = document.getElementById("clocks");
  root.innerHTML = CITIES.map((c, i) => `
    <div class="widget">
      <div class="city">${c.name}</div>
      <div class="time" id="time-${i}">--:--</div>
      <div class="date" id="date-${i}"></div>
    </div>`).join("");

  function tick() {
    const now = new Date();
    CITIES.forEach((c, i) => {
      const time = new Intl.DateTimeFormat("en-US", {
        timeZone: c.tz, hour: "2-digit", minute: "2-digit", hour12: !USE_24H
      }).format(now);
      const date = new Intl.DateTimeFormat("en-US", {
        timeZone: c.tz, weekday: "short", month: "short", day: "numeric"
      }).format(now);
      document.getElementById("time-" + i).textContent = time;
      document.getElementById("date-" + i).textContent = date;
    });
  }

  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>
