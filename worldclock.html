<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>world clock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@1&display=swap" rel="stylesheet">
<style>
  :root {
    --time-size: 44px;
    --time-stroke: 0.6px;
    --time-skew: -6deg;
    --city-size: 13px;
    --date-size: 12px;
    --vgap-main: 14px;      /* 도시-시간, 시간-날짜 간격 */

    --sub-time-size: 24px;
    --sub-time-stroke: 0.35px;
    --sub-city-size: 11px;
    --sub-date-size: 11px;
    --vgap-sub: 10px;       /* 보조 줄 간격 */
    --sub-gap: 24px;

    --heart-size: 16px;
    --heart-offset: 0px;    /* 하트 위치 미세 조정 (+면 아래로) */

    --city-color: #8a5f74;
    --date-color: #a98597;
    --card-bg: linear-gradient(135deg, #f9edf2 0%, #efdfe7 100%);
    --accent: #d05b82;
    --font: "Georgia", "Times New Roman", serif;
    --font-time: "DM Serif Display", "Times New Roman", serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --city-color: #ffffffcc;
      --date-color: #ffffff99;
      --card-bg: rgba(232, 120, 138, 0.12);
      --accent: #f08aa0;
    }
  }

  html, body { margin: 0; background: transparent; }
  body {
    font-family: var(--font);
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 0;
    box-sizing: border-box;
    text-align: center;
  }

  #card {
    box-sizing: border-box;
    width: 100%;
    max-width: 520px;
    padding: 28px 16px;
    border-radius: 22px;
    background: var(--card-bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 32px;
  }

  /* 도시 / 시간 / 날짜: 글자 윗선~아랫선만 남겨서 간격이 눈에 보이는 그대로 같게 */
  .city, .time, .date {
    margin: 0;
    line-height: 1.2;
    text-box-trim: trim-both;
    text-box-edge: cap alphabetic;
    text-box: trim-both cap alphabetic;
  }
  @supports not (text-box: trim-both cap alphabetic) {
    .city, .time, .date { line-height: 1; }
  }

  .grid { display: grid; justify-content: center; justify-items: center; align-items: start; }
  #main { grid-template-columns: repeat(3, auto); column-gap: 22px; row-gap: var(--vgap-main); }
  #sub  { grid-template-columns: repeat(3, 1fr); column-gap: var(--sub-gap); row-gap: var(--vgap-sub); }

  .city { font-size: var(--city-size); color: var(--city-color); letter-spacing: 0.04em; white-space: nowrap; }
  .flag { margin-right: 3px; opacity: 0.9; letter-spacing: 0; }

  .time {
    font-family: var(--font-time);
    font-style: italic;
    font-weight: 400;
    color: var(--accent);
    letter-spacing: 0.02em;
    white-space: nowrap;
    transform: skewX(var(--time-skew));
    font-variant-numeric: lining-nums tabular-nums;
    font-feature-settings: "lnum" 1, "tnum" 1;
  }

  /* 날짜만 기울임 + 날짜 속 숫자는 시간과 같은 폰트 */
  .date { font-size: var(--date-size); color: var(--date-color); font-style: italic; letter-spacing: 0.05em; white-space: nowrap; }
  .dn {
    font-family: var(--font-time);
    font-size: 0.98em;       /* 굵기를 옆 글자와 비슷하게 맞추려고 살짝 줄임 */
    font-style: italic;
    font-variant-numeric: lining-nums;
    font-feature-settings: "lnum" 1;
  }

  #main .time { font-size: var(--time-size); -webkit-text-stroke: var(--time-stroke) var(--accent); }
  #sub .city { font-size: var(--sub-city-size); letter-spacing: 0.03em; }
  #sub .time { font-size: var(--sub-time-size); -webkit-text-stroke: var(--sub-time-stroke) var(--accent); }
  #sub .date { font-size: var(--sub-date-size); letter-spacing: 0.03em; }

  /* 아랫줄 구분점: 열 경계의 정중앙, 시간 줄 높이에 맞춤 */
  .dot {
    grid-row: 2;
    align-self: center;
    justify-self: end;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--accent);
    opacity: 0.35;
    transform: translateX(calc(50% + var(--sub-gap) / 2));
  }

  /* 하트: '시간 줄'의 정중앙에 맞춤 */
  .heart {
    grid-column: 2;
    grid-row: 2;
    align-self: center;
    display: flex;
    color: var(--accent);
    opacity: 0.7;
    transform: translateY(var(--heart-offset));
  }
  .heart svg { width: var(--heart-size); height: var(--heart-size); }
</style>
</head>
<body>

<div id="card">
  <div class="grid" id="main"></div>
  <div class="grid" id="sub"></div>
</div>

<script>
  const USE_24H = true;

  const MAIN_CITIES = [
    { name: "Seoul", flag: "\u{1F1F0}\u{1F1F7}", tz: "Asia/Seoul" },
    { name: "HK",    flag: "\u{1F1ED}\u{1F1F0}", tz: "Asia/Hong_Kong" }
  ];

  const SUB_CITIES = [
    { name: "AK",  flag: "\u{1F1FA}\u{1F1F8}", tz: "America/Anchorage" },
    { name: "LA",  flag: "\u{1F1FA}\u{1F1F8}", tz: "America/Los_Angeles" },
    { name: "MEX", flag: "\u{1F1F2}\u{1F1FD}", tz: "America/Mexico_City" }
  ];

  const HEART = `<div class="heart"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg></div>`;

  // 윗줄: 서울=1열, 하트=2열, 홍콩=3열 / 아랫줄: 3등분 열 + 열 경계마다 구분점
  function cells(list, columns) {
    return list.map((c, i) => {
      const col = columns[i];
      return `
        <div class="city" style="grid-column:${col};grid-row:1"><span class="flag">${c.flag}</span>${c.name}</div>
        <div class="time" style="grid-column:${col};grid-row:2" data-tz="${c.tz}" data-kind="time">--:--</div>
        <div class="date" style="grid-column:${col};grid-row:3" data-tz="${c.tz}" data-kind="date"></div>`;
    }).join("");
  }

  document.getElementById("main").innerHTML = cells(MAIN_CITIES, [1, 3]) + HEART;
  document.getElementById("sub").innerHTML  = cells(SUB_CITIES,  [1, 2, 3])
    + '<div class="dot" style="grid-column:1"></div><div class="dot" style="grid-column:2"></div>';

  function tick() {
    const now = new Date();
    document.querySelectorAll("[data-tz]").forEach(el => {
      const tz = el.dataset.tz;
      if (el.dataset.kind === "time") {
        el.textContent = new Intl.DateTimeFormat("en-US", {
          timeZone: tz, hour: "2-digit", minute: "2-digit", hour12: !USE_24H
        }).format(now);
      } else {
        const text = new Intl.DateTimeFormat("en-US", {
          timeZone: tz, weekday: "short", month: "short", day: "numeric"
        }).format(now);
        el.innerHTML = text.replace(/\d+/g, '<span class="dn">$&</span>');
      }
    });
  }

  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>
