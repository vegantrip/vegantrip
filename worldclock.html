<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>world clock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@1&display=swap" rel="stylesheet">
<style>
  :root {
    --time-size: 48px;
    --time-stroke: 0.6px;
    --time-skew: -6deg;
    --city-size: 13px;
    --date-size: 12px;
    --gap: 56px;

    --sub-time-size: 24px;
    --sub-time-stroke: 0.35px;
    --sub-city-size: 11px;
    --sub-date-size: 11px;
    --sub-gap: 20px;

    --text-color: #37352f;
    --sub-color: #9b9a97;
    --accent: #e8788a;
    --font: "Georgia", "Times New Roman", serif;
    --font-time: "DM Serif Display", "Times New Roman", serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --text-color: #ffffffcc; --sub-color: #ffffff80; }
  }

  html, body { margin: 0; background: transparent; }
  body {
    font-family: var(--font);
    color: var(--text-color);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 40px;
    min-height: 100vh;
    padding: 16px;
    box-sizing: border-box;
    text-align: center;
  }
  .row { display: flex; justify-content: center; align-items: flex-start; }
  #main { gap: var(--gap); flex-wrap: wrap; }
  #sub  { gap: var(--sub-gap); flex-wrap: nowrap; }

  .city { font-size: var(--city-size); color: var(--sub-color); letter-spacing: 0.04em; }
  .flag { margin-right: 3px; vertical-align: -1px; opacity: 0.9; letter-spacing: 0; }
  .time {
    font-family: var(--font-time);
    font-style: italic;
    font-weight: 400;
    color: var(--accent);
    line-height: 1.1;
    margin: 6px 0;
    letter-spacing: 0.02em;
    white-space: nowrap;
    font-variant-numeric: lining-nums tabular-nums;
    font-feature-settings: "lnum" 1, "tnum" 1;
  }
  .time span { display: inline-block; transform: skewX(var(--time-skew)); }
  .date { font-size: var(--date-size); color: var(--sub-color); letter-spacing: 0.05em; }

  #main .time { font-size: var(--time-size); -webkit-text-stroke: var(--time-stroke) var(--accent); }

  #sub .city { font-size: var(--sub-city-size); letter-spacing: 0.03em; }
  #sub .time { font-size: var(--sub-time-size); margin: 4px 0; -webkit-text-stroke: var(--sub-time-stroke) var(--accent); }
  #sub .date { font-size: var(--sub-date-size); letter-spacing: 0.03em; }
</style>
</head>
<body>

<div class="row" id="main"></div>
<div class="row" id="sub"></div>

<script>
  const USE_24H = true;

  const MAIN_CITIES = [
    { name: "Seoul",     flag: "\u{1F1F0}\u{1F1F7}", tz: "Asia/Seoul" },
    { name: "Hong Kong", flag: "\u{1F1ED}\u{1F1F0}", tz: "Asia/Hong_Kong" }
  ];

  const SUB_CITIES = [
    { name: "Anchorage",   flag: "\u{1F1FA}\u{1F1F8}", tz: "America/Anchorage" },
    { name: "LA",          flag: "\u{1F1FA}\u{1F1F8}", tz: "America/Los_Angeles" },
    { name: "Mexico City", flag: "\u{1F1F2}\u{1F1FD}", tz: "America/Mexico_City" }
  ];

  function render(list, prefix, el) {
    el.innerHTML = list.map((c, i) => `
      <div class="widget">
        <div class="city"><span class="flag">${c.flag}</span>${c.name}</div>
        <div class="time"><span id="${prefix}-time-${i}">--:--</span></div>
        <div class="date" id="${prefix}-date-${i}"></div>
      </div>`).join("");
  }

  function update(list, prefix) {
    const now = new Date();
    list.forEach((c, i) => {
      const time = new Intl.DateTimeFormat("en-US", {
        timeZone: c.tz, hour: "2-digit", minute: "2-digit", hour12: !USE_24H
      }).format(now);
      const date = new Intl.DateTimeFormat("en-US", {
        timeZone: c.tz, weekday: "short", month: "short", day: "numeric"
      }).format(now);
      document.getElementById(prefix + "-time-" + i).textContent = time;
      document.getElementById(prefix + "-date-" + i).textContent = date;
    });
  }

  render(MAIN_CITIES, "m", document.getElementById("main"));
  render(SUB_CITIES, "s", document.getElementById("sub"));

  function tick() {
    update(MAIN_CITIES, "m");
    update(SUB_CITIES, "s");
  }

  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>
